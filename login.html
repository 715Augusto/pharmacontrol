<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Gestão de Estoque</title>
  <link rel="icon" href="./Imgs/Logo-mais-vida-120x90-azul-2.png" type="image/png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    .login-header { text-align: center; margin-bottom: 24px; }
    .login-header h1 { color: #0f172a; font-size: 1.5rem; margin-bottom: 8px; }
    .login-header p { color: #64748b; font-size: 0.9rem; }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.85rem; color: #334155; }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }
    .form-group input:focus { border-color: #0284c7; }
    
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .btn-submit:hover { background-color: #0369a1; }

    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      background-color: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .btn-google:hover {
      background-color: #f8fafc;
      border-color: #94a3b8;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
    }

    .btn-google:active { transform: scale(0.99); }

    .btn-google img { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h1>PharmaControl</h1>
      <p>Acesse sua conta para continuar</p>
    </div>
    
    <form id="form-login">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">Entrar no Sistema</button>
      
      <!-- type="button" evita validar e-mail/senha ao clicar no Google -->
      <!--<button id="btn-google" type="button" class="btn-google">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
        Entrar com e-mail corporativo
      </button> -->
    </form>
  </div>

<script type="module">
    // 1. Chama o segurança (ele não te expulsa porque sabe que você já está na tela de login)
    import './js/auth-guard.js';

    // 2. Puxa a conexão com o banco do arquivo correto
    import { supabase } from './js/supabase-client.js';

    const formLogin = document.getElementById('form-login');

    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault(); // Impede o recarregamento da página

      const email = document.getElementById('email').value;
      const password = document.getElementById('senha').value;

      // Autentica com e-mail e senha no Supabase
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        alert('Erro ao fazer login: ' + error.message);
      } else {
        // Redireciona para o dashboard em caso de sucesso
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
